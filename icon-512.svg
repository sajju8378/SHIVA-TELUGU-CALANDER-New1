<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="60%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
  </defs>
  <!-- Background with gold border -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" />
  <rect x="16" y="16" width="480" height="480" rx="84" fill="none" stroke="#facc15" stroke-width="6" stroke-opacity="0.7" />
  
  <!-- Radiant Sun Disc -->
  <circle cx="256" cy="220" r="110" fill="url(#sun)" filter="drop-shadow(0px 8px 16px rgba(0,0,0,0.4))" />
  
  <!-- Sun Rays -->
  <g stroke="#fef08a" stroke-width="6" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="70" x2="256" y2="92" />
    <line x1="256" y1="348" x2="256" y2="370" />
    <line x1="106" y1="220" x2="128" y2="220" />
    <line x1="384" y1="220" x2="406" y2="220" />
    <line x1="150" y1="114" x2="166" y2="130" />
    <line x1="346" y1="310" x2="362" y2="326" />
    <line x1="150" y1="326" x2="166" y2="310" />
    <line x1="346" y1="130" x2="362" y2="114" />
  </g>
  
  <!-- Kalasha / Kumbha Emblem & Om / Telugu Sign -->
  <circle cx="256" cy="220" r="80" fill="#7f1d1d" />
  
  <!-- Crescent Moon & Star inside -->
  <path d="M240 180 A40 40 0 1 0 285 245 A32 32 0 1 1 240 180 Z" fill="#fef08a" />
  
  <!-- Year 2027 banner -->
  <rect x="120" y="380" width="272" height="56" rx="12" fill="#450a0a" stroke="#facc15" stroke-width="3" />
  <text x="256" y="418" text-anchor="middle" fill="#fef08a" font-family="'Noto Sans Telugu', sans-serif" font-size="26" font-weight="bold">౨౦౨౭ • 2027</text>
</svg>
