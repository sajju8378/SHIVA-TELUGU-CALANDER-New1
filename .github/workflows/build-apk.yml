name: Build Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages & Licenses
        run: |
          yes | sdkmanager --licenses 2>/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" "build-tools;35.0.0" 2>/dev/null || true

      - name: Configure Android SDK Location
        run: |
          mkdir -p ./android
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "sdk.dir=$ANDROID_HOME" > ./android/local.properties
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "sdk.dir=$ANDROID_SDK_ROOT" > ./android/local.properties
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            echo "sdk.dir=/usr/local/lib/android/sdk" > ./android/local.properties
          fi
          cat ./android/local.properties || true

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Web Build to Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android APK with Gradle
        working-directory: ./android
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect Built APK
        run: |
          mkdir -p build-output
          APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find android -name "*.apk" 2>/dev/null | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" build-output/Telugu-Panchangam-2027.apk
            ls -lh build-output/Telugu-Panchangam-2027.apk
          else
            echo "Error: APK not found"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telugu-Panchangam-2027-APK
          path: build-output/Telugu-Panchangam-2027.apk
          retention-days: 60

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: "v1.0.0-apk"
          name: "Telugu Panchangam 2027 Android APK"
          draft: false
          prerelease: false
          body: |
            ## 📱 Telugu Panchangam 2027 Android APK
            Official standalone Android package for Telugu Panchangam 2027.
          files: |
            build-output/Telugu-Panchangam-2027.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
